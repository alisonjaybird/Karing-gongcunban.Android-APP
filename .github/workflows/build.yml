#7-2
name: Build Android APK (A1 & A2)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare vpn-service
        run: |
          if [ -d "vpn-service" ]; then
            cp -r vpn-service ../vpn-service
          elif [ -d "packages/vpn-service" ]; then
            cp -r packages/vpn-service ../vpn-service
          else
            mkdir -p ../vpn-service/lib
            cat << 'EOF' > ../vpn-service/pubspec.yaml
          name: vpn_service
          description: Mock vpn service
          version: 0.0.1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          EOF
            echo "class VpnService {}" > ../vpn-service/lib/vpn_service.dart
          fi

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create key.properties (debug signing)
        run: |
          cat << 'EOF' > key.properties
          storeFile.release=${{ runner.temp }}/debug.keystore
          storePassword.release=android
          keyAlias.release=androiddebugkey
          keyPassword.release=android
          EOF
          echo "Created key.properties"

      - name: Create debug keystore
        run: |
          KEYSTORE=${{ runner.temp }}/debug.keystore
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v -dname "CN=Android Debug,O=Android,C=US" \
              -alias androiddebugkey -keypass android -keystore "$KEYSTORE" \
              -storepass android -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "Created debug keystore at $KEYSTORE"

      - name: Disable sentry in build.gradle.kts
        run: |
          # 直接修改 build.gradle.kts，跳过 sentry.properties 的读取
          python3 << 'PYEOF'
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          
          # 注释掉 sentry 配置块
          content = content.replace('val sentryKeystore = rootProject.file', '# val sentryKeystore = rootProject.file')
          content = content.replace('val sentryProp = Properties().apply', '# val sentryProp = Properties().apply')
          
          # 注释掉整个 sentry {} 块
          lines = content.split('\n')
          result = []
          in_sentry_block = False
          skip_until_closing = 0
          
          for line in lines:
              if 'sentry {' in line:
                  in_sentry_block = True
                  result.append('// ' + line)
                  continue
              if in_sentry_block:
                  if line.strip().startswith('}'):
                      result.append('// ' + line)
                      in_sentry_block = False
                      continue
                  result.append('// ' + line)
                  continue
              result.append(line)
          
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(''.join(result))
          
          print('Disabled sentry configuration')
          PYEOF

      - name: Check source icons
        run: |
          echo "=== A1 source icons ==="
          ls -la android/app/src/a1/res/mipmap-xxhdpi/ 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== A2 source icons ==="
          ls -la android/app/src/a2/res/mipmap-xxhdpi/ 2>/dev/null || echo "(not found)"
          echo ""
          echo "=== Main icons ==="
          ls -la android/app/src/main/res/mipmap-xxhdpi/ 2>/dev/null || echo "(not found)"

      - name: Build A1
        run: |
          # 修改包名
          python3 -c "
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          content = content.replace('com.nebula.karing', 'com.nebula.karing.a1')
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          print('Modified package to com.nebula.karing.a1')
          "
          
          # 替换图标 - 从 a1 目录复制到 main 目录
          echo "Replacing icons for A1..."
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${dir}"
            if [ -f "android/app/src/a1/res/mipmap-${dir}/ic_launcher1.png" ]; then
              cp "android/app/src/a1/res/mipmap-${dir}/ic_launcher1.png" "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
              echo "Copied ic_launcher1.png -> ic_launcher.png for ${dir}"
            fi
          done
          
          echo "=== Building A1... ==="
          flutter build apk --release --no-tree-shake-icons 2>&1
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-a1-release.apk
            echo "A1 APK created successfully"
          else
            echo "ERROR: A1 APK not found!"
            exit 1
          fi

      - name: Upload A1
        uses: actions/upload-artifact@v4
        with:
          name: karing-A1
          path: build/app/outputs/flutter-apk/app-a1-release.apk

      - name: Restore and Build A2
        run: |
          # 恢复原始包名
          git checkout -- android/app/build.gradle.kts
          
          # 恢复原始图标
          echo "Restoring original icons..."
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            if [ -f "android/app/src/main/res/mipmap-${dir}/ic_launcher.png" ]; then
              rm -f "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
            fi
          done
          
          # 修改包名
          python3 -c "
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          content = content.replace('com.nebula.karing', 'com.nebula.karing.a2')
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          print('Modified package to com.nebula.karing.a2')
          "
          
          # 替换图标 - 从 a2 目录复制到 main 目录
          echo "Replacing icons for A2..."
          for dir in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            mkdir -p "android/app/src/main/res/mipmap-${dir}"
            if [ -f "android/app/src/a2/res/mipmap-${dir}/ic_launcher2.png" ]; then
              cp "android/app/src/a2/res/mipmap-${dir}/ic_launcher2.png" "android/app/src/main/res/mipmap-${dir}/ic_launcher.png"
              echo "Copied ic_launcher2.png -> ic_launcher.png for ${dir}"
            fi
          done
          
          echo "=== Building A2... ==="
          flutter build apk --release --no-tree-shake-icons 2>&1
          
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-a2-release.apk
            echo "A2 APK created successfully"
          else
            echo "ERROR: A2 APK not found!"
            exit 1
          fi

      - name: Upload A2
        uses: actions/upload-artifact@v4
        with:
          name: karing-A2
          path: build/app/outputs/flutter-apk/app-a2-release.apk
