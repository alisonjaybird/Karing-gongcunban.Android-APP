name: Build Android APK (A1 & A2)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare vpn-service
        run: |
          if [ -d "vpn-service" ]; then
            cp -r vpn-service ../vpn-service
          elif [ -d "packages/vpn-service" ]; then
            cp -r packages/vpn-service ../vpn-service
          else
            mkdir -p ../vpn-service/lib
            cat << 'EOF' > ../vpn-service/pubspec.yaml
          name: vpn_service
          description: Mock vpn service
          version: 0.0.1
          environment:
            sdk: '>=3.0.0 <4.0.0'
          dependencies:
            flutter:
              sdk: flutter
          EOF
            echo "class VpnService {}" > ../vpn-service/lib/vpn_service.dart
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create key.properties (debug signing)
        run: |
          cat << 'EOF' > key.properties
          storeFile.release=${{ runner.temp }}/debug.keystore
          storePassword.release=android
          keyAlias.release=androiddebugkey
          keyPassword.release=android
          EOF
          echo "Created key.properties"

      - name: Create debug keystore
        run: |
          KEYSTORE=${{ runner.temp }}/debug.keystore
          if [ ! -f "$KEYSTORE" ]; then
            keytool -genkey -v -dname "CN=Android Debug,O=Android,C=US" \
              -alias androiddebugkey -keypass android -keystore "$KEYSTORE" \
              -storepass android -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "Created debug keystore"

      - name: Create sentry.properties (mock)
        run: |
          mkdir -p private_for_build/karing/karing/android/sign
          cat << 'EOF' > private_for_build/karing/karing/android/sign/sentry.properties
          token=dummy-token-for-ci
          EOF
          echo "Created sentry.properties"

      - name: Build A1
        run: |
          python3 -c "
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          content = content.replace('com.nebula.karing', 'com.nebula.karing.a1')
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          print('Modified package to com.nebula.karing.a1')
          "
          flutter build apk --release --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-a1-release.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Upload A1
        uses: actions/upload-artifact@v4
        with:
          name: karing-A1
          path: build/app/outputs/flutter-apk/app-a1-release.apk

      - name: Restore and Build A2
        run: |
          git checkout -- android/app/build.gradle.kts
          python3 -c "
          with open('android/app/build.gradle.kts', 'r') as f:
              content = f.read()
          content = content.replace('com.nebula.karing', 'com.nebula.karing.a2')
          with open('android/app/build.gradle.kts', 'w') as f:
              f.write(content)
          print('Modified package to com.nebula.karing.a2')
          "
          flutter build apk --release --no-tree-shake-icons
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-a2-release.apk
          ls -la build/app/outputs/flutter-apk/

      - name: Upload A2
        uses: actions/upload-artifact@v4
        with:
          name: karing-A2
          path: build/app/outputs/flutter-apk/app-a2-release.apk
